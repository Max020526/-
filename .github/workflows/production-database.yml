name: Deploy Production Database

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type DEPLOY_PRODUCTION
        required: true
        type: string
      backup_reference:
        description: Supabase backup/PITR reference verified before deployment
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database
  cancel-in-progress: false

jobs:
  migrate:
    name: Approved production migration
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PRODUCTION_DATABASE_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
    steps:
      - name: Enforce main and explicit confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
          BACKUP_REFERENCE: ${{ inputs.backup_reference }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$CONFIRMATION" = "DEPLOY_PRODUCTION"
          test -n "$BACKUP_REFERENCE"
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.111.0
      - name: Refuse missing production credentials
        run: test -n "$SUPABASE_PROJECT_REF" && test -n "$SUPABASE_ACCESS_TOKEN" && test -n "$SUPABASE_DB_PASSWORD"
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
      - name: Preview production migration plan
        run: supabase db push --dry-run
      - name: Apply production migrations
        run: supabase db push
      - name: Confirm migration history
        run: supabase migration list --linked

  # Frontends remain blocked until this job succeeds. Netlify production sites
  # must use manual publish/build hooks during the migration-first transition.
