name: Security checks

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm --prefix apps/storefront ci
        if: hashFiles('apps/storefront/package-lock.json') != ''
      - name: Block high or critical dependency vulnerabilities
        run: npm audit --audit-level=high
      - name: Block high or critical Storefront dependency vulnerabilities
        run: npm --prefix apps/storefront audit --audit-level=high
        if: hashFiles('apps/storefront/package-lock.json') != ''
      - uses: actions/dependency-review-action@v4
        if: github.event_name == 'pull_request'
        with:
          fail-on-severity: high
