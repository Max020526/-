[build]
  command = "npm run build:netlify"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22.13.0"
  NETLIFY_NEXT_SKEW_PROTECTION = "true"
  STRICT_ENV_VALIDATION = "true"

[context.deploy-preview]
  command = "npm run build:netlify"

[context.deploy-preview.environment]
  NEXT_PUBLIC_APP_ENV = "preview"

[context.branch-deploy]
  command = "npm run build:netlify"

[dev]
  command = "npm run dev:netlify"
  targetPort = 3000

# NEXT_PUBLIC_APP_SURFACE and all URLs/keys must be configured per Netlify site.
# Do not place project-specific values in this file: six sites share it.
